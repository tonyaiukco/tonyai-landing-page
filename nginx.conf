# Serves the static export in out/. Container Apps terminates TLS, redirects HTTP to HTTPS
# and forwards the original Host header to port 8080.

# File names under /_next/static are content-hashed; everything else is revalidated.
map $uri $cache_control {
  ~^/_next/static/ "public, max-age=31536000, immutable";
  default          "no-cache";
}

# Only the canonical host may be indexed; an empty value omits the header.
map $host $robots_tag {
  tonyai.io "";
  default   "noindex";
}

# Set once here so both servers inherit them; a server or location that adds its own
# add_header would drop all of these.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cache-Control $cache_control always;
add_header X-Robots-Tag $robots_tag always;

server {
  listen 8080;
  server_name www.tonyai.io;
  return 301 https://tonyai.io$request_uri;
}

server {
  listen 8080 default_server;
  root /usr/share/nginx/html;
  index index.html;

  # Keep redirects relative so they never expose the container's port or plain HTTP.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml text/plain;

  # /sirket/ -> /sirket/index.html; /sirket -> 301 /sirket/ (the build uses trailing slashes).
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
