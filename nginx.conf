# Serves the static export in out/. Container Apps terminates TLS and forwards to 8080.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Keep redirects relative so they never expose the container's port or plain HTTP.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain font/woff2;

  # File names under /_next/static are content-hashed.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # /sirket/ -> /sirket/index.html; /sirket -> 301 /sirket/ (the build uses trailing slashes).
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
