name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A failed build stops here and the live site is untouched.
      - run: npm run build

      # The Azure steps are skipped until the AZURE_* repository variables exist (set after the first terraform apply).
      - name: Azure login (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The deploy token is read at run time and masked; it is never stored in GitHub.
      - name: Read the deploy token
        id: token
        if: vars.AZURE_CLIENT_ID != ''
        run: |
          token=$(az staticwebapp secrets list --name tonyai-site --resource-group tonyai-landing --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      # Uploads the finished static export; Azure's own build (Oryx) is skipped.
      - name: Upload to Static Web Apps
        if: vars.AZURE_CLIENT_ID != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: out
          skip_app_build: true
